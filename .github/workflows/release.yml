# Builds Switchboard and attaches the .dmg and .zip to a GitHub release:
# - pushing a tag like v0.2.0 by hand,
# - Auto Tag (after CI passes on main with a feat: or fix: commit) calls it with the new tag,
# - running it by hand (Actions ▸ Release ▸ Run workflow) only builds and keeps the app as a run artifact.
name: Release
on:
  push:
    tags: ["v*"]
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    env:
      # the tag to release: Auto Tag's, or the pushed one; empty = build only
      TAG: ${{ inputs.tag || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || '' }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Build
        run: |
          if [ -n "$TAG" ]; then VERSION="${TAG#v}" sh scripts/release.sh; else sh scripts/release.sh; fi
      - name: Publish
        if: env.TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "Switchboard $TAG" --generate-notes
          gh release upload "$TAG" dist/Switchboard-*.dmg dist/Switchboard-*.zip --clobber
      - name: Keep the build
        if: env.TAG == ''
        uses: actions/upload-artifact@v4
        with:
          name: Switchboard
          path: |
            dist/Switchboard-*.dmg
            dist/Switchboard-*.zip
