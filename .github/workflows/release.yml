# Push a tag like v0.2.0 to build Switchboard and attach the .dmg and .zip to a GitHub release.
# Run it by hand (Actions ▸ Release ▸ Run workflow) to only build the app and keep it as a run artifact.
name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Build
        run: |
          case "$GITHUB_REF" in
            refs/tags/v*) VERSION="${GITHUB_REF_NAME#v}" sh scripts/release.sh ;;
            *) sh scripts/release.sh ;;
          esac
      - name: Publish
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "Switchboard $GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" dist/Switchboard-*.dmg dist/Switchboard-*.zip --clobber
      - name: Keep the build
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: Switchboard
          path: |
            dist/Switchboard-*.dmg
            dist/Switchboard-*.zip
